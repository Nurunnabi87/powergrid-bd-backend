<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PowerGrid BD API</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --fg: #14171a;
        --muted: #5b6570;
        --line: #e3e6ea;
        --accent: #0b5fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1116;
          --card: #171b21;
          --fg: #e8eaed;
          --muted: #9aa4b0;
          --line: #262c34;
          --accent: #6ea8ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 32px;
      }
      h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
      p.sub { margin: 0 0 24px; color: var(--muted); }
      .status {
        display: inline-flex; align-items: center; gap: 7px;
        font-size: 13px; color: var(--muted); margin-bottom: 24px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      a.row {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px;
        text-decoration: none; color: inherit;
      }
      a.row:hover { border-color: var(--accent); }
      a.row span:last-child { color: var(--muted); font-size: 13px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      footer { margin-top: 24px; color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>PowerGrid BD API</h1>
      <p class="sub">Load Shedding &amp; Power Outage Management System</p>

      <div class="status"><span class="dot"></span> Service is running</div>

      <ul>
        <li>
          <a class="row" href="/api/docs">
            <span>Interactive API documentation</span><span>Swagger UI</span>
          </a>
        </li>
        <li>
          <a class="row" href="/api/docs/openapi.json">
            <span>OpenAPI specification</span><span>JSON</span>
          </a>
        </li>
        <li>
          <a class="row" href="/health"><span>Health check</span><span>/health</span></a>
        </li>
        <li>
          <a class="row" href="https://github.com/Nurunnabi87/powergrid-bd-backend">
            <span>Source code</span><span>GitHub</span>
          </a>
        </li>
      </ul>

      <footer>All endpoints are versioned under <code>/api/v1</code>.</footer>
    </main>
  </body>
</html>
